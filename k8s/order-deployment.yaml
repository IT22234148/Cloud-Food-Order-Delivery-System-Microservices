apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: your-dockerhub-username/order-service:latest
          ports:
            - containerPort: 5002
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017/fooddelivery"
            - name: JWT_SECRET
              value: "supersecretkey"
            - name: RESTAURANT_SERVICE_URL
              value: "http://restaurant-service:5001/api/restaurants"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:5003/api/payments"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
  type: ClusterIP