  delivery-service:
    build: ../Backend/delivery-service
    container_name: delivery-service
    ports:
      - "5002:5002"
    environment:
      - MONGO_URI=mongodb+srv://cloudfood_user:y7PvxlDxpZwMfXVx@cluster0.sepzjhs.mongodb.net/delivery-service
      - JWT_SECRET=supersecretkey
